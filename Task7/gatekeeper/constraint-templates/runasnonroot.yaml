apiVersion: templates.gatekeeper.sh/v1beta1
kind: ConstraintTemplate
metadata:
  name: k8srunasnonroot
spec:
  crd:
    spec:
      names:
        kind: K8sRunAsNonRoot
  targets:
    - target: admission.k8s.gatekeeper.sh
      rego: |
        package k8srunasnonroot

        violation[{"msg": msg}] {
          input.review.kind.kind == "Pod"
          some i
          container := input.review.object.spec.containers[i]

          not container.securityContext.runAsNonRoot
          msg := sprintf("container %v must set securityContext.runAsNonRoot=true", [container.name])
        }

        violation[{"msg": msg}] {
          input.review.kind.kind == "Pod"
          some i
          container := input.review.object.spec.containers[i]

          not container.securityContext.readOnlyRootFilesystem
          msg := sprintf("container %v must set securityContext.readOnlyRootFilesystem=true", [container.name])
        }
