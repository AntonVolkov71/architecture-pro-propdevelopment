apiVersion: templates.gatekeeper.sh/v1beta1
kind: ConstraintTemplate
metadata:
  name: k8shostpath
spec:
  crd:
    spec:
      names:
        kind: K8sHostPath
  targets:
    - target: admission.k8s.gatekeeper.sh
      rego: |
        package k8shostpath

        violation[{"msg": msg}] {
          input.review.kind.kind == "Pod"
          volumes := input.review.object.spec.volumes
          some i
          volumes[i].hostPath.path != ""
          msg := sprintf("hostPath volume %v is not allowed", [volumes[i].name])
        }
